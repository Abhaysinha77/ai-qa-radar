<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://hn.algolia.com; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI+QA">
<title>AI + QA Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="title-row">
    <h1>AI + QA Radar</h1>
    <button id="refresh" class="icon-btn" aria-label="Refresh now" title="Refresh now">↻</button>
  </div>
  <div id="status" class="status" aria-live="polite">Loading…</div>
  <input id="search" type="search" placeholder="Search everything…" aria-label="Search" autocomplete="off">
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="hot" aria-current="page"><span>🔥</span>Hot</button>
  <button data-tab="today"><span>📰</span>Today</button>
  <button data-tab="topics"><span>🏷️</span>Topics</button>
  <button data-tab="releases"><span>📦</span>Releases</button>
  <button data-tab="learn"><span>🎓</span>Learn</button>
  <button data-tab="more"><span>⭐</span>Saved+</button>
</nav>

<noscript><p class="empty">This app needs JavaScript. Raw data: <a href="data.json">data.json</a></p></noscript>
<script src="app.js" defer></script>
</body>
</html>
