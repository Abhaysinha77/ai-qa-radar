<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://hn.algolia.com; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kairoq">
<title>Kairoq — AI &amp; QA signal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=9">
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#hot" data-tab="hot"><img src="icon.svg" alt="" width="30" height="30"><span>Kairo<b>q</b></span></a>
    <nav id="chipnav" class="topnav" aria-label="Sections"></nav>
    <div class="search-wrap">
      <svg class="i search-ico" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="search" type="search" placeholder="Search news, terms, courses…" aria-label="Search" autocomplete="off"><kbd class="kbd">⌘K</kbd>
    </div>
    <button class="icon-btn" data-act="density" aria-label="Switch compact / comfortable view" title="Compact / comfortable view"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button id="refresh" class="icon-btn" aria-label="Refresh now" title="Refresh now">↻</button>
    <button class="icon-btn" data-act="theme" aria-label="Switch theme" title="Theme">◐</button>
  </div>
</header>

<div class="app">
  <div class="main">
    <div id="status" class="status" aria-live="polite">Loading…</div>
    <main id="view" tabindex="-1"></main>
  </div>
  <aside id="rail" class="rail" aria-label="Trending and learning"></aside>
</div>

<nav id="tabs" class="tabs" aria-label="Sections"></nav>

<div id="reader-backdrop" class="reader-backdrop" hidden></div>
<aside id="reader" class="reader" role="dialog" aria-modal="true" aria-label="Article summary" hidden></aside>

<noscript><p class="empty">This app needs JavaScript. Raw data: <a href="data.json">data.json</a></p></noscript>
<script src="app.js?v=9" defer></script>
</body>
</html>
